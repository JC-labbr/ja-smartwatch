async function adminRender(){let root=$('#admincontent');if(!session){root.innerHTML='<div class="box" style="max-width:430px;margin:35px auto"><div class="eyebrow">ÁREA RESTRITA</div><h1>Painel administrativo</h1><p>Entre com o usuário autorizado no Supabase.</p><form id="login"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button class="btn" style="width:100%;justify-content:center">Entrar no painel</button><div id="loginmsg" class="alert hide"></div></form></div>';$('#login').onsubmit=async e=>{e.preventDefault();let r=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(r.error){$('#loginmsg').textContent=r.error.message;$('#loginmsg').classList.remove('hide')}else{session=r.data.session;adminRender()}};return}
let r=await Promise.all([db.from('products').select('*,categories(id,name,slug)').order('created_at',{ascending:false}),db.from('categories').select('*').order('sort_order'),db.from('store_settings').select('value').eq('key','store').maybeSingle(),db.from('profiles').select('id,role').eq('id',session.user.id).maybeSingle()]);if(r[3].error||r[3].data?.role!=='admin'){root.innerHTML='<div class="alert"><b>Usuário autenticado, mas sem permissão de administrador.</b><br>Consulte o README no GitHub e eleve somente o perfil autorizado para role = admin no SQL Editor do Supabase.<br><br><button class="outline" id="logout">Sair</button></div>';$('#logout').onclick=async()=>{await db.auth.signOut();session=null;adminRender()};return}
products=r[0].data||[];categories=r[1].data||[];settings={...settings,...(r[2].data?.value||{})};root.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><div class="eyebrow">J&A SMARTWATCH</div><h1>Gerencie sua loja.</h1><p>Altere produtos, preços, fotos e estoque sem editar código.</p></div><div>'+products.length+' produtos　<button class="outline" id="logout">Sair</button></div></div><div id="msg" class="alert hide"></div><div class="tabs"><button class="active" data-tab="products">Produtos</button><button data-tab="settings">Configurações</button></div><div id="adminbody"></div>';$('#logout').onclick=async()=>{await db.auth.signOut();session=null;adminRender()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));b.dataset.tab==='products'?productsTab():settingsTab()});productsTab()}
function notify(t){$('#msg').textContent=t;$('#msg').classList.remove('hide')}
function productsTab(){let body=$('#adminbody'),p=products.find(x=>String(x.id)===String(editing));body.innerHTML='<div class="layout"><form class="box" id="pform"><div class="eyebrow">'+(p?'EDITAR PRODUTO':'NOVO CADASTRO')+'</div><h2>'+(p?'Editar produto':'Adicionar produto')+'</h2><label>Nome<input id="pn" required></label><div class="row"><label>SKU<input id="ps"></label><label>Slug<input id="pl"></label></div><label>Descrição<textarea id="pd" rows="3"></textarea></label><div class="row"><label>Preço<input id="pp" type="number" min="0" step=".01" required></label><label>Preço anterior<input id="po" type="number" min="0" step=".01"></label></div><div class="row"><label>Categoria<select id="pc"><option value="">Sem categoria</option>'+categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label><label>Estoque<input id="pst" type="number" min="0" value="0"></label></div><label>URL da imagem<input id="pi" placeholder="https://…"></label><label>Especificações em JSON<textarea id="px" rows="3">{}</textarea></label><label><input id="pa" type="checkbox" checked style="display:inline;width:auto"> Produto ativo</label><label><input id="pf" type="checkbox" style="display:inline;width:auto"> Em destaque</label><button class="btn" style="width:100%;justify-content:center">Salvar produto</button><button type="button" class="outline" id="cancel" style="width:100%;margin-top:8px">Limpar</button></form><section class="box"><h2>Produtos cadastrados ('+products.length+')</h2><div class="productslist">'+products.map(x=>'<div class="listrow"><img src="'+esc(x.image_url||'')+'"><div><b>'+esc(x.name)+'</b><small>'+esc(x.sku||'Sem SKU')+' · '+esc(x.categories?.name||'Sem categoria')+'</small><strong>'+money(x.price)+' · estoque '+x.stock+'</strong><small>'+(x.is_active?'Ativo':'Inativo')+(x.is_featured?' · Destaque':'')+'</small></div><div class="ops"><button class="outline" data-edit="'+x.id+'">Editar</button><button class="outline" data-off="'+x.id+'" style="margin-top:5px">Desativar</button></div></div>').join('')+'</div></section></div>';
if(p){$('#pn').value=p.name||'';$('#ps').value=p.sku||'';$('#pl').value=p.slug||'';$('#pd').value=p.description||'';$('#pp').value=p.price;$('#po').value=p.compare_at_price||'';$('#pc').value=p.category_id||'';$('#pst').value=p.stock||0;$('#pi').value=p.image_url||'';$('#px').value=JSON.stringify(p.specifications||{},null,2);$('#pa').checked=p.is_active;$('#pf').checked=p.is_featured}
$('#cancel').onclick=()=>{editing=null;productsTab()};$('#pform').onsubmit=async e=>{e.preventDefault();let specs;try{specs=JSON.parse($('#px').value||'{}')}catch{notify('Especificações precisam estar em JSON válido.');return}let name=$('#pn').value.trim(),slug=$('#pl').value.trim()||name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),payload={name:name,sku:$('#ps').value.trim()||null,slug:slug,description:$('#pd').value.trim(),price:Number($('#pp').value),compare_at_price:$('#po').value?Number($('#po').value):null,category_id:$('#pc').value||null,stock:Number($('#pst').value||0),image_url:$('#pi').value.trim()||null,specifications:specs,is_active:$('#pa').checked,is_featured:$('#pf').checked};let saved=p?await db.from('products').update(payload).eq('id',p.id).select('id').single():await db.from('products').insert(payload).select('id').single();if(saved.error){notify('Erro: '+saved.error.message);return}let id=p?p.id:saved.data.id;if(payload.image_url){let old=await db.from('product_images').select('id').eq('product_id',id).limit(1).maybeSingle();if(old.data?.id)await db.from('product_images').update({image_url:payload.image_url,alt_text:name}).eq('id',old.data.id);else await db.from('product_images').insert({product_id:id,image_url:payload.image_url,alt_text:name,sort_order:0})}editing=null;await adminRender();notify('Produto salvo com sucesso.')};body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;productsTab();scrollTo({top:0,behavior:'smooth'})});body.querySelectorAll('[data-off]').forEach(b=>b.onclick=async()=>{let x=products.find(y=>String(y.id)===b.dataset.off);if(!confirm('Desativar '+x.name+'?'))return;let q=await db.from('products').update({is_active:false}).eq('id',x.id);if(q.error)notify(q.error.message);else{editing=null;await adminRender();notify('Produto desativado.')}})}
function settingsTab(){let b=$('#adminbody');b.innerHTML='<form class="box" id="sform" style="max-width:640px"><div class="eyebrow">DADOS DA LOJA</div><h2>Configurações</h2><label>Nome da loja<input id="sn" value="'+esc(settings.store_name||'J&A Smartwatch')+'"></label><label>Número do WhatsApp com DDI e DDD<input id="sw" value="'+esc(settings.whatsapp_number||'')+'" placeholder="5522999999999"><small class="hint">Somente números, incluindo 55 + DDD. Esse número recebe os pedidos.</small></label><label>Texto da faixa superior<input id="sa" value="'+esc(settings.announcement||'')+'"></label><label>Referência de frete grátis (R$)<input id="sf" type="number" min="0" step=".01" value="'+Number(settings.free_shipping_threshold??299)+'"></label><button class="btn">Salvar configurações</button></form>';$('#sform').onsubmit=async e=>{e.preventDefault();let val={store_name:$('#sn').value,whatsapp_number:$('#sw').value.replace(/\D/g,''),announcement:$('#sa').value,free_shipping_threshold:Number($('#sf').value||0),currency:'BRL'},r=await db.from('store_settings').upsert({key:'store',value:val,updated_at:new Date().toISOString()});if(r.error)notify('Erro: '+r.error.message);else{settings=val;notify('Configurações salvas.')}}}
async function boot(){if(location.hash==='#admin'){admin();return}try{let r=await Promise.all([db.from('products').select('*,categories(name,slug),product_images(image_url,alt_text,sort_order)').eq('is_active',true).order('is_featured',{ascending:false}),db.from('categories').select('name,slug').eq('is_active',true).order('sort_order'),db.from('store_settings').select('value').eq('key','store').maybeSingle()]);if(r[0].error)throw r[0].error;products=(r[0].data||[]).map(p=>({...p,image_url:p.image_url||p.product_images?.[0]?.image_url}));categories=r[1].data||[];if(r[2].data?.value)settings={...settings,...r[2].data.value};if(!products.length)products=demo}catch(e){products=demo;categories=[{name:'Masculinos',slug:'masculinos'},{name:'Femininos',slug:'femininos'},{name:'Esportivos',slug:'esportivos'},{name:'Clássicos',slug:'classicos'},{name:'Casual',slug:'casual'}]}store()}
window.addEventListener('hashchange',()=>location.hash==='#admin'?admin():boot());boot();
</script></body></html>
